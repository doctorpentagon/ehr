<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AwibiEHR — Intelligent Healthcare</title>
    <meta name="description" content="AwibiEHR: Smart, fast, affordable electronic health records for Nigerian healthcare facilities." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts — prevents blank white flash -->
      <div id="app-loader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9999;">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="margin-bottom:16px">
          <circle cx="20" cy="20" r="18" stroke="#E8EEFF" stroke-width="4"/>
          <path d="M20 2a18 18 0 0 1 18 18" stroke="#335CF4" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="0.8s" repeatCount="indefinite"/>
          </path>
        </svg>
        <p style="font-family:system-ui,sans-serif;font-size:14px;color:#6B7280;margin:0">Loading Awibi EHR…</p>
      </div>
    </div>
    <script>
      /**
       * Show startup errors on the page.
       *
       * If the application fails before React renders there is nothing on
       * screen to say why, and the only record is a browser console that
       * whoever hit the problem may not know how to open — or cannot reach, on
       * a phone. Capturing the error and printing it turns "it does not work"
       * into a specific line of code.
       */
      window.__awibiStartupErrors = [];
      function awibiRecordError(label, detail) {
        window.__awibiStartupErrors.push(label + ': ' + detail);
      }
      window.addEventListener('error', function (e) {
        if (e.message) awibiRecordError('Error', e.message + (e.filename ? '  (' + e.filename + ':' + e.lineno + ')' : ''));
        else if (e.target && e.target.src) awibiRecordError('Failed to load', e.target.src);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        awibiRecordError('Unhandled promise', (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason));
      });

      // The application removes this itself once React has rendered.
      //
      // This is only a failsafe. The loader covers the whole viewport, so if it
      // is ever left in place the app renders underneath and the user sees a
      // spinner forever with no way to tell whether anything is wrong. Ten
      // seconds is far longer than a normal start and short enough that nobody
      // concludes the product is broken.
      setTimeout(function () {
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.remove();
        // If React had mounted it would have removed this already, so say what
        // happened rather than leaving a blank page behind.
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          var errors = window.__awibiStartupErrors || [];
          var detail = errors.length
            ? '<pre style="white-space:pre-wrap;word-break:break-word;background:#FEF2F2;border:1px solid #FECACA;'
              + 'color:#991B1B;padding:.75rem;border-radius:.5rem;font-size:.75rem;line-height:1.45;margin:0 0 1rem;'
              + 'max-height:16rem;overflow:auto">' + errors.join('\n\n').replace(/</g, '&lt;') + '</pre>'
            : '<p style="color:#4B5563;font-size:.9rem;margin:0 0 1rem">No error was reported, which usually means a '
              + 'script was blocked before it ran.</p>';
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:40rem;margin:10vh auto;padding:0 1.5rem;color:#111">'
            + '<h1 style="font-size:1.25rem;margin:0 0 .5rem">Awibi EHR did not start</h1>'
            + '<p style="color:#4B5563;font-size:.9rem;line-height:1.5;margin:0 0 1rem">'
            + 'The page loaded but the application did not. The reason is below.</p>'
            + detail
            + '<button onclick="location.reload()" style="padding:.6rem 1.1rem;border:0;border-radius:.5rem;'
            + 'background:#335CF4;color:#fff;font-size:.875rem;cursor:pointer">Reload</button></div>';
        }
      }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
