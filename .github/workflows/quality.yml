name: Quality gates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Awibi-EHR-Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Awibi-EHR-Backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://audit:audit@localhost:5432/audit
      - run: npm run test:unit
      - run: npm run test:contract

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Awibi-EHR-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Awibi-EHR-Frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
